name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      # PR code must not push into the trusted cache: withhold the token and skip
      # the push unless the run is on main (push or workflow_dispatch).
      - uses: cachix/cachix-action@v17
        with:
          name: aegis-lock
          authToken: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: ${{ !(github.event_name != 'pull_request' && github.ref == 'refs/heads/main') }}

      - name: Build aegis-lock
        run: nix build .#packages.${{ matrix.system }}.default
